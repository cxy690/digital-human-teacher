[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "education"
version = "0.1.0"
description = "纯 AI 教师 1 对 1 线上实时答疑教学系统（智能麦控 + 实时讲解）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "education-team" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.2",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "loguru>=0.7",
    "edge-tts>=6.1",
    # 教师技能 SKILL.md 的 frontmatter 解析（.agents/skills/**）
    "PyYAML>=6.0",
    # 数学求解 / 独立验算：AI 老师讲错方程答案时靠它纠正，不是可选装饰
    "sympy>=1.12",
]

[project.optional-dependencies]
vision = [
    "mediapipe>=0.10,<0.11",
    "opencv-python>=4.9",
]
ragvector = [
    # 向量检索加速（可选）：装了用 FAISS，缺失用 numpy 精确检索（功能一致）
    "faiss-cpu>=1.8",
]
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]
langgraph = [
    "langgraph>=0.2",
]
digitalhuman = [
    "pypinyin>=0.5",
    "imageio-ffmpeg>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
education-server = "server.app:main"
education-demo = "scripts.run_demo:main"
education-mcp = "mcp_tools.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["a2a*", "agents*", "clients*", "config*", "core*", "db*", "document_parsing*", "mcp_tools*", "models*", "rag*", "scripts*", "server*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 只收集本项目的测试：云端项目根下有 models_zoo（CosyVoice/MuseTalk 等第三方仓库，
# 内含自己的 test_*.py），不限目录会在收集阶段就因缺依赖报错、整体中断。
testpaths = ["tests"]
norecursedirs = ["models_zoo", "digital_human", ".venvs", "data", "logs", "_cloud_pull"]
