<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />  <!-- 显式空图标：避免浏览器请求 /favicon.ico 产生 404 噪音 -->
  <title>AI 教师 1 对 1 · 学生端</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --accent:#1677ff; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Microsoft YaHei", system-ui, sans-serif; background:var(--bg); color:#e2e8f0; height:100vh; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; }
    .badges { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
    .badge { font-size:12px; padding:3px 10px; border-radius:999px; background:#0b1220; border:1px solid var(--line); }
    .badge.ok { color:var(--ok); border-color:var(--ok); }
    .badge.warn { color:var(--warn); border-color:var(--warn); }
    .badge.bad { color:var(--bad); border-color:var(--bad); }
    /* 主区域：左侧白板（绿框）+ 右侧竖列（上 AI 教师 / 下 学生端） */
    .stage { display:flex; flex:1; min-height:0; }
    /* 白板：占据左侧主要空间 */
    .board-wrap { position:relative; flex:1 1 auto; min-width:0; background:#fff; }
    /* 右侧竖列：AI 教师在上（蓝框）、学生端在下（紫框） */
    .side-col { flex:0 0 20%; display:flex; flex-direction:column; min-width:0; border-left:1px solid var(--line); }
    .side-col .pane { position:relative; flex:1 1 50%; min-height:0; overflow:hidden; background:#0b1220; }
    .side-col .pane.teacher { border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0b1220,#132038); }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #avatar { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
    /* AI 讲解中：仅保留画面本身（不叠加发光/呼吸提示，避免遮挡教师） */
    /* 数字人讲师：眨眼 + 视素口型 + 表情（元素在 SVG 内，随 viewBox 自适应缩放） */
    /* 数字人：待机时显示静态形象；AI 讲解时由 #avatar-video / #avatar-video-b
       播放服务端逐句渲染的对口型视频，靠 z-order + opacity 盖住待机层 */
    /* 数字人画面：固定、不可交互（禁止缩放/画中画/点击） */
    /* 数字人画面整体放大倍率：静态图/口型层/眨眼层/视频全部同步放大，层间对齐不破坏；
       超出头像区的部分由 .pane 的 overflow:hidden 裁掉，等效于把画面放大 */
    /* --avatar-xfade：「待机 ↔ 讲解」交叉淡化时长（统一收口，真人切换 0.3~0.5s 更利落） */
    :root { --avatar-zoom: 1.2; --avatar-xfade: .45s; }
    .avatar-frame { position:relative; overflow:hidden; pointer-events:none; transform:scale(var(--avatar-zoom)); }
    .avatar-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    /* 无视频时的轻量口型兜底：嘴部叠一层同图副本，按音频能量纵向开合。
       坐标基于统一标定（所有老师底片已归一化：脸中心 50%/37.5%，眼位 y=33.1%） */
    #mouth-layer { transform-origin:50% 46%; will-change:transform;
      -webkit-mask-image:radial-gradient(ellipse 2.6% 2.4% at 50% 46%, #000 55%, transparent 100%);
              mask-image:radial-gradient(ellipse 2.6% 2.4% at 50% 46%, #000 55%, transparent 100%); }
    /* 待机眨眼：静态睁眼帧之上叠一张「闭眼整帧图」（后端同源合成），短促显示形成自然眨眼。
       用整帧图而非局部坐标压合 —— 头像走 object-fit:cover 裁切，百分比坐标会随窗口宽高比漂移。 */
    #idle-blink { opacity:0; transition:opacity .07s linear; }
    .avatar-frame.blink #idle-blink { opacity:1; }
    /* 数字人视频双缓冲：两个 video 交叉淡化，句子/待机切换不闪断 */
    #avatar-video, #avatar-video-b { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; opacity:0; transition:opacity var(--avatar-xfade) ease-in-out; }
    #avatar-video.vid-on, #avatar-video-b.vid-on { opacity:1; }
    /* 讲完题回到待机：末帧（音频静音段最后一帧，嘴部已闭合）先冻结成过渡帧，
       盖在待机底片之上，再用 --avatar-xfade 交叉淡出——消除「嘴部瞬间闪现」的观感 */
    /* 过渡帧：canvas 尺寸=显示尺寸（按 cover 手动裁剪），直接铺满，无需 object-fit */
    #transition-frame { position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
      opacity:0; transition:opacity var(--avatar-xfade) ease-in-out; }
    #transition-frame.on { opacity:1; }
    #avatar-video.fade-out, #avatar-video-b.fade-out { transition:opacity var(--avatar-xfade) ease-in-out; }
    /* 底片待机视频：常驻底层、始终循环播放；讲解时被上层对口型视频完全覆盖，
       讲完只需淡出上层即可丝滑露出底片（无交叉淡化、无静态图渗色、无定格） */
    #idle-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; opacity:1; }
    /* 短交接减少脸部姿态不同造成的重影；底图常驻，解码前不撤走旧画面。 */
    #idle-still { opacity:0; }
    #idle-still.on { opacity:1; }
    /* （已移除头像状态角标：只显示教师画面） */
    .video-overlay { display:flex; gap:8px; flex-wrap:wrap; }
    .video-overlay button { padding:5px 8px; font-size:12px; }
    canvas { position:absolute; inset:0; width:100%; height:100%; }
    .board-text { position:absolute; inset:0; overflow-y:auto; padding:14px 20px; font-size:19px; line-height:1.75; color:#1f1f1f; white-space:pre-wrap; word-break:break-word; }
    /* 讲解过长时，右侧出现明显滚动条（字号恒定，绝不缩放） */
    .board-text::-webkit-scrollbar { width:10px; }
    .board-text::-webkit-scrollbar-thumb { background:#c1c1c1; border-radius:5px; }
    .board-text::-webkit-scrollbar-track { background:#f1f1f1; }
    .board-text .bt-title { font-size:22px; font-weight:700; color:#d4380d; margin:0 0 8px; }
    .board-text .bt-step { margin:5px 0; }
    /* 重点标红：模型在白板文字里用 **…** 标出的字词（见 renderEmphasis） */
    .board-text .bt-key { color:#ff4d4f; font-weight:600; }
    /* ---------- 课件（PPT）讲解 ---------- */
    /* 课件页：铺满整个白板作背景，与右上角小图的「题目图」是两回事 */
    .board-slide, .board-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; background:#fff; }
    .board-slide[hidden], .board-photo[hidden] { display:none; }
    /* 课件 / 拍照讲题模式：图片铺满白板，讲解文字收成底部字幕条，不遮挡图片内容。
       字幕条高度由 --bt-h 控制（默认 32%）：一行字常被截掉半截，学生可拖上沿的手柄
       上下拉动调高（见 #bt-grip / initBoardTextGrip），高度记忆在 localStorage。 */
    .board-wrap.has-slide, .board-wrap.has-photo { background:#fff; }
    .board-wrap.has-slide .board-text, .board-wrap.has-photo .board-text { top:auto; bottom:0; height:var(--bt-h, 32%); max-height:var(--bt-h, 32%); padding:10px 16px; font-size:17px; line-height:1.6; background:rgba(255,255,255,.9); border-top:1px solid var(--line); }
    /* 没有讲解文字时整条收起：白板上不留一条空带 */
    .board-wrap.has-slide .board-text:empty, .board-wrap.has-photo .board-text:empty { display:none; }
    /* 上下拉动的手柄：贴在字幕条上沿，鼠标与触摸都能拖；双击复位 */
    .bt-grip { display:none; position:absolute; left:0; right:0; height:18px; bottom:var(--bt-h, 32%); margin-bottom:-9px; z-index:6; cursor:ns-resize; touch-action:none; }
    .board-wrap.has-slide .bt-grip, .board-wrap.has-photo .bt-grip { display:block; }
    .board-wrap.has-slide .board-text:empty + .bt-grip,
    .board-wrap.has-photo .board-text:empty + .bt-grip { display:none; }
    .bt-grip::before { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:72px; height:5px; border-radius:3px; background:#94a3b8; box-shadow:0 0 0 1px rgba(255,255,255,.75); opacity:.6; transition:opacity .15s, background .15s; }
    .bt-grip:hover::before, .bt-grip.dragging::before { opacity:1; background:#2563eb; }
    /* 课件列表下拉：课件名（含年级/章节）较长，必须允许换行。
       注意要用 .popmenu.cw-menu 提高权重，否则会被下面 .popmenu button 的
       white-space:nowrap 盖掉 —— 长标题会一路撑出菜单框。 */
    .popmenu.cw-menu { width:262px; max-width:76vw; max-height:62vh; overflow-y:auto; }
    .popmenu.cw-menu button { width:100%; max-width:100%; text-align:left; white-space:normal; line-height:1.35; }
    /* 章节小标题：一册 40~60 份课件需要分组，否则一长条找不到东西 */
    .popmenu.cw-menu button.cw-chap { position:sticky; top:0; z-index:1; background:var(--panel);
      color:#93c5fd; font-size:12px; font-weight:600; padding:6px 8px 4px; border-bottom:1px solid var(--line);
      opacity:1; cursor:default; }
    .cw-page { font-size:12px; color:#9aa4b2; }
    /* 当前学习的课件名 chip：常驻显示在「课件」按钮旁，超长省略（title 属性看全文） */
    .cw-title { font-size:12px; color:#cbd5e1; background:#0b1220; border:1px solid var(--line);
      border-radius:999px; padding:3px 10px; max-width:230px; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; cursor:pointer; }
    .cw-title:hover { border-color:var(--accent); color:#93c5fd; }
    /* 课件菜单里「正在学习」的那一份：高亮 + 绿色标记 */
    .popmenu.cw-menu button.cw-current { border:1px solid #22c55e; background:rgba(34,197,94,.10); }
    .toolbar { display:flex; gap:8px; align-items:center; padding:8px 16px; background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap; }
    button { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
    button.ghost { background:#0b1220; border:1px solid var(--line); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    /* 上传图片下拉菜单 + 拍照弹窗 */
    .img-upload { position:relative; display:inline-flex; }
    .popmenu { position:absolute; bottom:calc(100% + 6px); left:0; z-index:60; display:flex; flex-direction:column; gap:6px; padding:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
    .popmenu[hidden] { display:none; }
    .popmenu button { width:100%; text-align:left; white-space:nowrap; }
    .cam-modal { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.72); }
    .cam-modal[hidden] { display:none; }
    /* 课程续费 / 结束提示弹窗 */
    /* 已停用：课程结算弹窗 + 结束课程按钮样式（对应 HTML 已注释） */
    /*
    .course-box { max-width:min(92vw,460px); }
    .course-box h3 { margin:0 0 6px; font-size:17px; color:#facc15; }
    .course-box p { margin:0; font-size:14px; line-height:1.65; color:#e2e8f0; }
    .course-box .course-sub { color:#94a3b8; font-size:12px; margin-top:4px; }
    .chip.end-course { cursor:pointer; border:1px solid rgba(248,113,113,.5); color:#fca5a5;
                       background:rgba(248,113,113,.12); font:inherit; padding:4px 10px; }
    .chip.end-course:hover { background:rgba(248,113,113,.22); color:#fecaca; }
    .chip.end-course[hidden] { display:none; }
    */
    .cam-box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; max-width:92vw; }
    .cam-box video { width:min(80vw,640px); max-height:60vh; background:#000; border-radius:8px; }
    .cam-actions { display:flex; gap:8px; justify-content:flex-end; }
    /* 视频讲解录制 */
    .rec-hint { color:#e2e8f0; font-size:13px; }
    #btn-record.recording { background:#b91c1c; border-color:#b91c1c; }
    #rec-video { width:min(80vw,720px); max-height:60vh; border-radius:8px; background:#000; }
    #rec-download { display:inline-flex; align-items:center; text-decoration:none; padding:8px 14px; border-radius:8px; background:#0b1220; border:1px solid var(--line); color:#e2e8f0; font-size:13px; }
    #rec-download[hidden] { display:none; }
    input[type=text] { flex:1; min-width:180px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#0b1220; color:#e2e8f0; }
    main { display:flex; flex-direction:column; flex:1; min-height:0; }
    /* 消息区：固定高度，不随内容伸缩（避免逐条消息把上方区往上推），内容多了右侧出滚动条 */
    .chat { height:22vh; overflow-y:auto; padding:6px 16px; font-size:13px; background:#0b1220; border-top:1px solid var(--line); }
    .chat::-webkit-scrollbar { width:10px; }
    .chat::-webkit-scrollbar-thumb { background:#334155; border-radius:5px; }
    .chat::-webkit-scrollbar-track { background:#0b1220; }
    .chat .ai { color:#7dd3fc; } .chat .student { color:#fca5a5; }
    /* 互动追问：作答卡片与判定反馈 */
    .chat .ai.feedback.ok { color:#22c55e; }
    .chat .ai.feedback.warn { color:#f59e0b; }
    .ask-card { margin:6px 0; padding:8px 10px; background:#0f1a2e; border:1px solid var(--accent); border-radius:10px; display:flex; flex-direction:column; gap:6px; }
    .ask-q { color:#e2e8f0; font-size:13px; }
    .ask-opt { text-align:left; background:#152238; border:1px solid var(--line); color:#e2e8f0; padding:6px 10px; border-radius:8px; cursor:pointer; }
    .ask-hint { color:#94a3b8; font-size:12px; }
    /* ---------- 1v1 辅导课：学科 / 阶段 / 倒计时 ---------- */
    /* 学科徽章：已移入顶栏（原 course-bar 整行删除，省出的高度让给白板） */
    header .chip.subject { font-size:12px; padding:3px 10px; border-radius:999px; background:#0b1220; border:1px solid #1d4ed8; color:#93c5fd; white-space:nowrap; }
    .course-bar .chip.phase { color:#facc15; border-color:#a16207; }
    /* 已停用：课程倒计时 chip 样式
    .course-bar .chip.timer { color:#22c55e; border-color:#15803d; font-variant-numeric:tabular-nums; min-width:74px; text-align:center; }
    */
    .course-bar .chip.timer.warn { color:#f59e0b; border-color:#b45309; }
    .course-bar .chip.timer.bad { color:#ef4444; border-color:#b91c1c; }
    /* 教师打招呼挥手 / 表扬特效（无数字人引擎时的 CSS 兜底，与视频手势双路径） */
    #greet-wave, #praise-burst { position:absolute; right:8%; bottom:6%; font-size:44px; opacity:0; pointer-events:none; }
    .avatar-frame.wave #greet-wave { animation:wave-anim 1.7s ease-in-out 2; }
    .avatar-frame.praise #praise-burst { animation:pop-anim 1.3s ease-out 1; }
    @keyframes wave-anim {
      0%,100% { opacity:0; transform:rotate(0deg) scale(.8); }
      15%,85% { opacity:1; }
      25% { transform:rotate(18deg) scale(1.05); }
      50% { transform:rotate(-14deg) scale(1.05); }
      75% { transform:rotate(14deg) scale(1.05); }
    }
    @keyframes pop-anim {
      0% { opacity:0; transform:scale(.4) translateY(10px); }
      30% { opacity:1; transform:scale(1.15); }
      100% { opacity:0; transform:scale(1) translateY(-26px); }
    }
    /* 非 HTTPS 访问时的能力降级横幅：浏览器在非安全上下文禁用麦克风/摄像头 */
    .net-banner { display:flex; align-items:flex-start; gap:10px; padding:10px 16px; font-size:12.5px; line-height:1.65;
      color:#fde68a; background:rgba(120,53,15,.5); border-bottom:1px solid rgba(251,191,36,.45); }
    .net-banner[hidden] { display:none; }
    .net-banner b { color:#fbbf24; }
    button.locked { opacity:.42; cursor:not-allowed; }
    /* 开始上课闸门：浏览器要求「用户手势」后才允许播放带声音频，故用一次点击同时解锁语音与开课 */
    .start-gate { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; background:rgba(2,6,23,.88); }
    .start-gate[hidden] { display:none; }
    .start-box { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 30px; max-width:440px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center; box-shadow:0 20px 50px rgba(0,0,0,.5); }
    .start-box .start-emoji { font-size:44px; line-height:1; }
    .start-box h2 { margin:0; font-size:18px; }
    .start-box p { margin:0; color:#94a3b8; font-size:13px; line-height:1.7; }
    .start-box button { padding:11px 26px; font-size:15px; }
    .start-box .start-back { color:#93c5fd; font-size:12px; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI 教师 1 对 1 辅导</h1>
      <span class="chip subject" id="chip-subject" hidden>学科：-</span>
      <!-- 已停用：课程倒计时 + 结束课程按钮。
           恢复方式：去掉下面两行的注释符号，并恢复 JS 里 initCourseBilling / beginCourseBilling 的调用。
      <span class="chip timer" id="chip-timer" hidden>[timer]</span>
      <button type="button" class="chip end-course" id="btn-end-course" hidden>结束课程</button>
      -->
      <div class="badges">
        <!-- 项目开发人员专属入口（仅 admin 登录时由脚本显示，服务端另有门禁兜底） -->
        <a class="badge" id="chip-skill-admin" href="/app/skill_admin/" hidden
           style="text-decoration:none;color:#93c5fd">技能管理</a>
        <span class="badge" id="status-conn">未连接</span>
        <span class="badge" id="status-mic">麦控：-</span>
        <span class="badge" id="status-ai">AI：空闲</span>
        <span class="badge" id="status-mood">教师：待机</span>
        <span class="badge" id="build-tag" style="color:#22c55e;border-color:#22c55e">前端 v18</span>
      </div>
      <div class="video-overlay">
        <button class="ghost" id="btn-cam">关闭摄像头</button>
        <button class="ghost" id="btn-mic">关闭麦克风</button>
      </div>
    </header>

    <!-- 非 HTTPS 访问提示（默认隐藏，仅在不安全上下文显示） -->
    <div class="net-banner" id="net-banner" hidden>
      <span>⚠️</span>
      <span>
        <b>语音与拍照暂不可用</b>：当前是 HTTP 访问，浏览器出于安全策略禁用了麦克风与摄像头。
        你仍然可以在下方输入框<b>用文字提问</b>；若需要语音和拍照，请让分享者改用 HTTPS 地址打开本页。
      </span>
    </div>

    <!-- 主区域：左白板（绿框） + 右侧竖列（上 AI 教师·蓝框 / 下 学生端·紫框） -->
    <!-- 学科标识已移入顶栏；原 course-bar 整行删除，其高度让给白板 -->
    <section class="stage">
      <!-- 白板 -->
      <section class="board-wrap">
        <img class="board-slide" id="board-slide" alt="" hidden />
        <img class="board-photo" id="board-photo" alt="" hidden />
        <canvas id="board"></canvas>
        <div class="board-text" id="board-text"></div>
        <!-- 讲解区上沿的拖动手柄：按住上下拉可调高字幕条（双击复位）。

        <div class="bt-grip" id="bt-grip" title="按住上下拖动，调整讲解区高度（双击复位）"></div>

              <video id="avatar-video" playsinline preload="auto" disablePictureInPicture controlsList="nodownload noplaybackrate noremoteplayback nofullscreen"></video>
              <video id="avatar-video-b" playsinline preload="auto" disablePictureInPicture controlsList="nodownload noplaybackrate noremoteplayback nofullscreen"></video>
              <!-- 过渡帧：置于最上层。待机→说话时冻结「待机当前帧」，说话→待机时冻结「讲解末帧」，
                   与另一侧做交叉淡出，两个方向都不会出现闪现 -->
              <canvas id="transition-frame"></canvas>

  <!-- 开始上课闸门：未带 ?subject 时引导去选学科；带了学科则点击后开课并解锁语音 -->
