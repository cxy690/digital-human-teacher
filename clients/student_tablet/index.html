    // ---------- 语音提问 / 实时对话（浏览器录音上传服务端识别 / 兼容旧浏览器识别）----------
    let talking = false, talkTimer = null, recog = null, recogText = "", recogMode = null;
    let convoOn = false;

    function ensureRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      if (recog) return recog;
      recog = new SR();
      recog.lang = "zh-CN";
      recog.interimResults = true;   // 边说边出中间结果
      recog.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) recogText += e.results[i][0].transcript;
        }
      };
      recog.onerror = (e) => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          alert("浏览器未授权语音识别，请在地址栏允许麦克风权限");
          stopConvo();
        } else if (e.error === "network") {
          alert("浏览器语音识别需要联网（使用在线识别服务）");
        }
      };
      recog.onend = () => {
        const mode = recogMode; recogMode = null;
        const text = recogText.trim();
        if (mode === "ptt") {
          if (text) { submitQuestion(text, true); }
          else { send({ type: "voice", data: btoa("demo-audio") }); logChat("student", "（语音）未识别到内容，已使用占位提问"); }
          $("btn-talk").textContent = "按住提问（语音）";
        } else if (mode === "convo") {
          if (aiSpeaking) return;                 // AI 正在讲解，等它说完再继续
          if (text) submitQuestion(text, true);
          else if (convoOn) resumeListening();
        }
      };
      return recog;
    }

    function startRecognition(mode) {
      const r = ensureRecognition();
      if (!r) return null;
      recogMode = mode;
      r.continuous = (mode === "ptt");            // 按住模式手动停；对话模式说完自动停
      recogText = "";
      try { r.start(); } catch (e) { /* 已在识别中则忽略 */ }
      return r;
    }

    function submitQuestion(text, fromVoice) {
      markActivity();
      bargeIn();                       // 打断老师正在讲的旧内容，立刻听新问题
      if (!send({ type: "text", text })) {
        logChat("ai", "连接已断开，正在自动重连，请稍后重试～");
        return;
      }
      logChat("student", (fromVoice ? "（语音）" : "") + text);
      pendingLocalEcho = text;         // 标记原文：服务端回传的同一条不要再渲染一遍
      setAvatarMood("thinking");
      if (convoOn) {
        // 兜底：万一没收到 AI 语音，6 秒后恢复聆听
        setTimeout(() => { if (convoOn && !aiSpeaking && avatarMood === "thinking") resumeListening(); }, 6000);
      }
    }

    // ---------- 语音输入：录音 -> WAV -> 上传服务端识别 ----------
    // 说明：不再依赖浏览器在线语音识别（Chrome 走 Google / Edge 走微软，国内常不可用）。
    // 改为把录音在浏览器转成 16k 单声道 WAV 上传，由服务端 ASR 识别 —— 国内任意现代浏览器可用。
    let voiceStream = null, voiceRec = null, voiceChunks = [], voiceActive = false;

    async function ensureMicStream() {
      // 麦克风流自愈：设备切换/系统休眠后旧流的 track 会变成 ended，
      // 此时复用旧流只能录到静音（ASR 返回空），必须重新申请。
      const live = voiceStream && voiceStream.active
        && voiceStream.getAudioTracks().some((t) => t.readyState === "live");
      if (live) return voiceStream;
      if (voiceStream) { try { voiceStream.getTracks().forEach((t) => t.stop()); } catch (e) { /* ignore */ } }
      voiceStream = null;
      voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return voiceStream;
    }
    function pickVoiceMime() {
      const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
      for (const m of cands) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
      return "";
    }
    async function startVoiceRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return false;
      try { await ensureMicStream(); } catch (e) { return false; }
      try {
        voiceChunks = [];
        const mime = pickVoiceMime();
        voiceRec = new MediaRecorder(voiceStream, mime ? { mimeType: mime } : undefined);
        voiceRec.ondataavailable = (e) => { if (e.data && e.data.size) voiceChunks.push(e.data); };
        voiceRec.start();
        voiceActive = true;
        return true;
      } catch (e) { voiceRec = null; voiceActive = false; return false; }
    }
    function stopVoiceRecording() {
      return new Promise((resolve) => {
        const rec = voiceRec; voiceRec = null; voiceActive = false;
        if (!rec) { resolve(null); return; }
        rec.onstop = () => {
          const blob = new Blob(voiceChunks, { type: rec.mimeType || "audio/webm" });
          voiceChunks = [];
          resolve(blob.size ? blob : null);
        };
        try { rec.stop(); } catch (e) { resolve(null); }
      });
    }
    // 解码用 AudioContext 全局复用：每次都 new + close 会累积（close 是异步的），
    // 用一会后可能撞上浏览器 AudioContext 数量上限，表现为「突然录不了音」。
    let decodeCtx = null;
    function getDecodeCtx() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!decodeCtx || decodeCtx.state === "closed") decodeCtx = new AC();
      return decodeCtx;
    }
    // 任意录音格式 -> 16k 单声道 PCM16 WAV 的 base64（服务端对 webm 会 500，WAV 稳定可用）
    async function blobToWavBase64(blob) {
      const arr = await blob.arrayBuffer();
      const actx = getDecodeCtx();
      const audioBuf = await actx.decodeAudioData(arr.slice(0));
      const sr = 16000, ch = audioBuf.numberOfChannels, srcRate = audioBuf.sampleRate;
      const srcDatas = []; for (let c = 0; c < ch; c++) srcDatas.push(audioBuf.getChannelData(c));
      const outLen = Math.max(1, Math.floor(audioBuf.length * sr / srcRate));
      const bytes = new Uint8Array(44 + outLen * 2);
      const dv = new DataView(bytes.buffer);
      const put = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
      put(0, "RIFF"); dv.setUint32(4, 36 + outLen * 2, true); put(8, "WAVE");
      put(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
      put(36, "data"); dv.setUint32(40, outLen * 2, true);
      let off = 44;
      for (let i = 0; i < outLen; i++) {
        const t = i * srcRate / sr, i0 = Math.floor(t), i1 = Math.min(audioBuf.length - 1, i0 + 1), f = t - i0;
        let v = 0;
        for (let c = 0; c < ch; c++) v += srcDatas[c][i0] * (1 - f) + srcDatas[c][i1] * f;
        v = Math.max(-1, Math.min(1, v / ch));
        dv.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7fff, true); off += 2;
      }
      let bin = ""; const CH = 0x8000;
      for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
      return btoa(bin);
    }
    async function sendVoiceRecording() {
      const blob = await stopVoiceRecording();
      if (!blob) { logChat("student", "（语音）没有录到声音，请按住按钮说话、说完再松开"); return; }
      try {
        const b64 = await blobToWavBase64(blob);
        if (!send({ type: "voice", data: b64 })) {
          logChat("ai", "连接已断开，正在自动重连，请等几秒后再按住说话～");
          return;
        }
        armVoiceWatchdog();
      } catch (e) {
        logChat("student", "（语音）音频处理失败：" + e.message);
      }
    }
    // 语音识别兜底：发送后若迟迟没有任何 AI 回应，给出可见提示，避免一直停在「识别中…」
    let voiceWatchdog = null;
    function armVoiceWatchdog() {
      clearVoiceWatchdog();
      voiceWatchdog = setTimeout(() => {
        voiceWatchdog = null;
        logChat("ai", "没收到识别结果，可能没听清或网络较慢。可以再说一遍，或直接打字告诉我～");
      }, 15000);
    }
    function clearVoiceWatchdog() {
      if (voiceWatchdog) { clearTimeout(voiceWatchdog); voiceWatchdog = null; }
    }

    // --- 按住提问 ---
    async function talkStart() {
      if (talking) return;
      markActivity();
      if (!micOn) { alert("麦克风已关闭，请先点「打开麦克风」再提问"); return; }
      talking = true;
      stopAiSpeech();                    // 学生一按住，AI 立即停止讲解（打断）
      reportSlidePos();                  // 断点续讲：按住即上报本页已播进度
      send({ type: "interrupt" });       // 同步通知后端：立刻闭嘴并中止课件连讲（不必等识别结果）
      // 按住期间持续上报“有语音”帧，让麦控状态机累积到“学生在说”
      send({ type: "vad", has_voice: true, ts_ms: Date.now() });
      talkTimer = setInterval(() => send({ type: "vad", has_voice: true, ts_ms: Date.now() }), 100);
      setAvatarMood("listening");
      $("btn-talk").textContent = "正在聆听…松开发送";
      const ok = await startVoiceRecording();
      if (!talking) { if (voiceRec) stopVoiceRecording(); return; }   // 已松手：丢弃这次录音
      if (!ok) { $("btn-talk").textContent = "按住提问（语音）"; logChat("student", "（语音）无法访问麦克风，请检查麦克风权限（需 HTTPS）"); }
    }
    function talkEnd() {
      if (!talking) return;
      talking = false;
      if (talkTimer) { clearInterval(talkTimer); talkTimer = null; }
      send({ type: "vad", has_voice: false, ts_ms: Date.now() });
      // 补发一次静音帧，确保麦控进入“可答疑”（静默窗口 700ms）
      setTimeout(() => send({ type: "vad", has_voice: false, ts_ms: Date.now() }), 800);
      $("btn-talk").textContent = "按住提问（语音）";
      if (voiceActive || voiceRec) { logChat("student", "（语音）已发送，识别中…"); sendVoiceRecording(); }
    }
    $("btn-talk").addEventListener("mousedown", talkStart);
    $("btn-talk").addEventListener("mouseup", talkEnd);
    $("btn-talk").addEventListener("mouseleave", talkEnd);
    $("btn-talk").addEventListener("touchstart", (e) => { e.preventDefault(); talkStart(); });
    $("btn-talk").addEventListener("touchend", talkEnd);

    // --- 实时对话（免按：说完自动提问，AI 说完自动继续听）---
    function startConvo() {
      if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) { alert("免按「实时对话」依赖浏览器在线识别（国内常不可用）；请改用「按住提问（语音）」，它走服务端识别、稳定可用。"); return; }
      if (!micOn) { alert("麦克风已关闭，请先点「打开麦克风」"); return; }
      convoOn = true;
      const b = $("btn-convo"); b.textContent = "结束对话"; b.style.background = "var(--bad)";
      resumeListening();
    }
    function stopConvo() {
      convoOn = false;
      const b = $("btn-convo"); if (b) { b.textContent = "开始对话"; b.style.background = ""; }
      try { recog && recog.stop(); } catch (e) { /* ignore */ }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      setAvatarMood("idle");
    }
    function resumeListening() {
      if (!convoOn || aiSpeaking) return;
      setTimeout(() => {
        if (!convoOn || aiSpeaking) return;
        recogText = "";
        const r = startRecognition("convo");
        if (r) setAvatarMood("listening");
      }, 300);
    }
    $("btn-convo").onclick = () => (convoOn ? stopConvo() : startConvo());

    // ---------- 文字提问 ----------
    $("btn-send").onclick = sendText;
    $("input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendText(); });
    function sendText() {
      const t = $("input").value.trim();
      if (!t) return;
      $("input").value = "";
      submitQuestion(t, false);   // 复用：发消息 + 写入聊天框 + 进入思考态
    }

    // ---------- 1v1 辅导课：只展示学科（阶段条 / 倒计时 / 结束按钮已移除）----------
    // 后端下发的课程状态（学科）
    function applyCourseState(payload) {
      if (!payload) return;
      const subj = $("chip-subject");
      if (subj && payload.subject) { subj.textContent = "学科：" + payload.subject; subj.hidden = false; }
    }

    // ---------- 课程课时与计费 ----------
    // 课时由**服务端**持有：中途退出页面倒计时不会停，到点由后端自动结算关闭；
    // 同一学生可同时有多门课，这里全部轮询并展示（弹窗只针对需要处理的那门）。
    const STUDENT_ID = (() => {
      try {
        if (AUTH_USER && AUTH_USER.id) return String(AUTH_USER.id);   // 已登录：以账号 id 为准
        let v = localStorage.getItem("student_id");
        if (!v) { v = "s" + Math.random().toString(36).slice(2, 10); localStorage.setItem("student_id", v); }
        return v;
      } catch (e) { return "anonymous"; }
    })();
    let coursePolicyBilling = { price: 0, currency: "元", free_seconds: 120, renew_prompt_seconds: 300 };
    let myCourses = [];             // 进行中的课程（服务端返回）
    let coursePollId = null;
    let courseModalShownFor = "";   // 已弹过提示的课程 id，避免重复弹

    function fmtClock(sec) {
      const s = Math.max(0, Math.floor(sec));
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }

    let courseModalKind = "";   // "renew" = 续费提示 | "ended" = 课程结束结算

    // ⛔ 已停用：课程倒计时 / 结束按钮 / 结算弹窗 / 续费提示。
    // 入口（initCourseBilling 事件绑定与轮询、beginCourseBilling 开课）已全部注释，
    // renderCourseTimer ~ beginCourseBilling 这组函数因此没有调用方，保留函数体只为将来一键恢复。
    // 相关 HTML / CSS 也已在文件里注释并标注「已停用」。
    function renderCourseTimer() {
      // 已停用：倒计时 chip 与「结束课程」按钮一律隐藏（原展示逻辑见本段末尾注释）
      const chip = $("chip-timer"), btn = $("btn-end-course");
      if (chip) chip.hidden = true;
      if (btn) btn.hidden = true;
      // 原逻辑（恢复时启用）：
      // if (!chip) return;
      // if (!myCourses.length) { chip.hidden = true; if (btn) btn.hidden = true; return; }
      // const soonest = myCourses.slice().sort((a, b) => a.remaining_seconds - b.remaining_seconds)[0];
      // chip.hidden = false; if (btn) btn.hidden = false;
      // chip.textContent = "⏱ " + fmtClock(soonest.remaining_seconds)
      //   + (myCourses.length > 1 ? " (+" + (myCourses.length - 1) + ")" : "");
      // chip.classList.toggle("warn", soonest.remaining_seconds <= coursePolicyBilling.renew_prompt_seconds);
    }

    // 结算弹窗：课程结束（到点自动关 / 主动点「结束课程」）后展示用时与计费。
    // 展示的同时向服务端发 interrupt —— 老师立刻停口，不会"课都结束了还在讲"。
    function showSettlement(info) {
      const modal = $("course-modal");
      if (!modal) return;
      courseModalKind = "ended";
      const used = Math.max(0, Math.floor(info.elapsed_seconds || 0));
      const mins = Math.floor(used / 60), secs = used % 60;
      const freeMin = Math.round((coursePolicyBilling.free_seconds || 0) / 60);
      const price = coursePolicyBilling.price;
      const verdict = info.charge > 0
        ? "已超过 " + freeMin + " 分钟免费时长，按整节课计费"
          + (price > 0 ? "（" + info.charge + coursePolicyBilling.currency + "）" : "") + "。"
        : "未超过 " + freeMin + " 分钟免费时长，本次不收费。";
      $("course-modal-title").textContent = "本节课已结束";
      $("course-modal-text").textContent =
        (info.subject ? info.subject + "课" : "") + "用时 " + mins + " 分 " + secs + " 秒，" + verdict;
      $("course-modal-sub").textContent = "点击「我知道了」返回课程选择。";
      $("course-renew").hidden = true;
      $("course-ack").textContent = "我知道了";
      $("course-ack").dataset.courseId = "";
      try { send({ type: "interrupt" }); } catch (e) { /* 静音信号失败不影响弹窗 */ }
      modal.hidden = false;
    }

    function showCourseModal(course, expired) {
      const modal = $("course-modal");
      if (!modal) return;
      if (expired) { showSettlement(course); return; }   // 结束 -> 走结算弹窗
      courseModalKind = "renew";
      const priceText = coursePolicyBilling.price > 0
        ? "（" + coursePolicyBilling.price + coursePolicyBilling.currency + "）" : "";
      const freeMin = Math.round((coursePolicyBilling.free_seconds || 0) / 60);
      $("course-modal-title").textContent = "课程即将结束";
      $("course-modal-text").textContent =
        (course.subject || "本") + "课还剩 " + fmtClock(course.remaining_seconds) + "，"
        + "续费可再加一节（" + (course.duration_minutes || 40) + " 分钟）。"
        + "若现在结束：已用时长不超过 " + freeMin + " 分钟不收费，超过则按整节课计费" + priceText + "。";
      $("course-modal-sub").textContent = "";
      $("course-renew").hidden = false;
      $("course-renew").dataset.courseId = course.course_id;
      $("course-ack").textContent = "知道了";
      $("course-ack").dataset.courseId = course.course_id;
      modal.hidden = false;
    }

    async function pollCourses() {
      try {
        const r = await fetch("/api/course/status?student_id=" + encodeURIComponent(STUDENT_ID));
        if (!r.ok) return;
        const data = await r.json();
        if (data.policy) coursePolicyBilling = data.policy;
        const courses = data.courses || [];
        const before = myCourses.map((c) => c.course_id);
        myCourses = courses;
        renderCourseTimer();
        // 由「有」变「无」= 服务端已结算关闭（到点自动关闭，或在别处点了结束）
        const goneId = before.find((id) => !courses.some((c) => c.course_id === id));
        if (goneId) {
          let info = { elapsed_seconds: 0, charge: 0 };
          try {
            const b = await fetch("/api/course/bills?student_id=" + encodeURIComponent(STUDENT_ID));
            const bd = await b.json();
            const hit = (bd.bills || []).filter((x) => x.course_id === goneId).pop();
            if (hit) info = hit;      // 以服务端账单为准（用时/收费）
          } catch (e) { /* 账单取不到也不阻塞提示 */ }
          showSettlement(info);
          return;
        }
        const need = courses.find((c) => c.need_renew_prompt);
        if (need && courseModalShownFor !== need.course_id) {
          courseModalShownFor = need.course_id;
          showCourseModal(need, false);
        }
      } catch (e) { /* 网络抖动忽略，下轮再试 */ }
    }

    // 「结束课程」：立刻结算并停课（未超过免费时长不收费），随后展示结算弹窗
    async function endCourse() {
      if (!myCourses.length) return;
      const target = myCourses.slice().sort((a, b) => a.remaining_seconds - b.remaining_seconds)[0];
      let info = {
        elapsed_seconds: Math.max(0, (target.duration_minutes || 40) * 60 - target.remaining_seconds),
        charge: 0,
        subject: target.subject,
      };
      try {
        const r = await fetch("/api/course/close", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ course_id: target.course_id }),
        });
        const data = await r.json();
        if (data.course) info = data.course;      // 结算结果以服务端为准
      } catch (e) { /* 结算请求失败也提示课程已结束 */ }
      myCourses = myCourses.filter((c) => c.course_id !== target.course_id);
      renderCourseTimer();
      showSettlement(info);
    }

    async function beginCourseBilling(subject) {
      try {
        const r = await fetch("/api/course/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ student_id: STUDENT_ID, subject, teacher: TEACHER }),
        });
        if (!r.ok) return;
        const data = await r.json();
        if (data.policy) coursePolicyBilling = data.policy;
        if (data.course) myCourses = [data.course];
        renderCourseTimer();
      } catch (e) { /* 开课计费失败不阻断上课 */ }
      if (!coursePollId) coursePollId = setInterval(pollCourses, 3000);
    }

    // ===== 已停用：课程计费的启动入口（倒计时展示 / 结束课程按钮 / 结算与续费弹窗）=====
    // 连同 HTML 与 CSS 一起停用；后端接口 /api/course/* 未改动，恢复时去掉本段注释即可。
    //
    // (function initCourseBilling() {
    //   const renew = $("course-renew"), ack = $("course-ack"), endBtn = $("btn-end-course");
    //   if (endBtn) endBtn.onclick = () => { endCourse(); };
    //   if (renew) renew.onclick = async () => {

    //     $("course-modal").hidden = true;
    //     try {
    //       await fetch("/api/course/renew", {
    //         method: "POST", headers: { "Content-Type": "application/json" },
    //         body: JSON.stringify({ course_id: id }),
    //       });
    //     } catch (e) { /* ignore */ }
    //     courseModalShownFor = "";
    //     pollCourses();
    //   };
    //   if (ack) ack.onclick = async () => {
    //     $("course-modal").hidden = true;
    //     // 课程已结束：点「我知道了」退回课程选择界面
    //     if (courseModalKind === "ended") {
    //       window.location.href = "/app/subject_select/";
    //       return;

    //     const id = ack.dataset.courseId || "";
    //     try {
    //       await fetch("/api/course/ack", {

    //         body: JSON.stringify({ course_id: id }),

    //   // 进页面就开始轮询：之前在别处开的课退出后仍在跑，这里要能接着显示
    //   pollCourses();
    //   coursePollId = setInterval(pollCourses, 3000);
    // })();
    // 学生插话：立刻停掉老师正在播的内容（视频/音频/朗读），转去听新问题
    function bargeIn() {
      reportSlidePos();                  // 断点续讲：任何打断（本地或后端 interrupt）都先上报已播进度
      stopAvatarVideo();
      const a = $("ai-audio");
      if (a) { try { a.pause(); } catch (e) { /* ignore */ } a.removeAttribute("src"); }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (avatarIdleTimer) { clearTimeout(avatarIdleTimer); avatarIdleTimer = null; }
      aiSpeaking = false;
    }
    // 开课闸门：浏览器要求页面先有「用户手势」才允许播放带声音的音频，
    // 否则教师打招呼的语音会被静默拦截（浏览器策略，非后端问题）。
    // 未带 ?subject 时改为引导回到学科选择页，避免出现「一片安静、什么都没发生」。
    let gateShown = false, wsReady = false;
    function showStartGate() {
      const gate = $("start-gate");
      if (!gate) return;
      const title = $("start-title"), desc = $("start-desc"), btn = $("btn-start");
      if (!SUBJECT) {
        title.textContent = "还没有选择学科";
        desc.textContent = "请先回到学科选择页挑一门学科，老师才知道要给你上什么课哦。";
        btn.textContent = "去选择学科";
        btn.onclick = () => { location.href = "../subject_select/index.html"; };
      } else {
        title.textContent = SUBJECT + " · 一对一辅导";
        desc.textContent = "点击「开始上课」，老师会先和你打招呼；全程约 "
          + (coursePolicy.duration_minutes || 40) + " 分钟，可随时结束。";
        btn.textContent = "开始上课";
        btn.onclick = () => { gate.hidden = true; startCourse(); };
      }
      gate.hidden = false;
    }
    function maybeShowStartGate() {
      if (gateShown || !coursePolicyLoaded || !wsReady) return;
      if (SUBJECT && !coursePolicy.enable) return;   // 课程功能关闭：保持纯答疑模式
      gateShown = true;
      showStartGate();
    }
    // 非 HTTPS 降级：明确告知 + 禁用受影响的控件，避免「点了没反应」的静默失败
    function applyInsecureMode() {
      if (SECURE_CTX) return;
      const banner = $("net-banner");
      if (banner) banner.hidden = false;
      [["btn-talk", "语音提问"], ["btn-convo", "语音对话"], ["btn-mic", "麦克风"],
       ["btn-cam", "摄像头"], ["btn-camera", "拍照上传"]].forEach(([id, label]) => {
        const el = $(id);
        if (!el) return;
        el.disabled = true;
        el.classList.add("locked");
        el.title = label + "需要 HTTPS：当前为 HTTP 访问，浏览器已禁用该权限";
      });
      const talk = $("btn-talk");
      if (talk) talk.textContent = "语音需 HTTPS";
      const convo = $("btn-convo");
      if (convo) convo.textContent = "语音需 HTTPS";
    }
    function startCourse() {
      if (courseStarted || !SUBJECT) return;
      courseStarted = true;
      currentPhase = "";
      // 解锁音频：AudioContext 需在用户手势中恢复，否则 TTS 只出画面不出声
      try { ensureAnalyser($("ai-audio")); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }
      catch (e) { /* ignore */ }
      const subj = $("chip-subject");
      if (subj) { subj.textContent = "学科：" + SUBJECT; subj.hidden = false; }
      // 已停用：开课计费 / 课时倒计时（不再创建计时课程，也不轮询课程状态）
      // beginCourseBilling(SUBJECT);   // 开始本节课的课时倒计时（服务端持有，退出页面仍在跑）
      // 带上所选老师：后端据此决定用谁的形象/音色/人格（为空则用学科默认老师）
      send({ type: "course_start", subject: SUBJECT, teacher: TEACHER });   // 触发教师主动打招呼（语言 + 挥手）
    }
    // 浏览器自动播放策略兜底：进入页面即开课打招呼，但首次带声播放可能被拦截；
    // 任意点击/按键后恢复音频上下文，并把被拦截的那句重新排队播放。
    let pendingAvatarSrc = "";
    function unlockAudio() {
      window.removeEventListener("pointerdown", unlockAudio);
      window.removeEventListener("keydown", unlockAudio);
      try { ensureAnalyser($("ai-audio")); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }
      catch (e) { /* ignore */ }
      // 预取麦克风权限：在首次用户手势时就申请，避免「第一次按住提问正好在弹权限框」导致白按一次
      try { if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && micOn) ensureMicStream().catch(() => {}); }
      catch (e) { /* ignore */ }
      if (pendingAvatarSrc) {
        avatarQueue.unshift(pendingAvatarSrc);
        pendingAvatarSrc = "";
        pumpAvatarQueue();
      }
    }
    window.addEventListener("pointerdown", unlockAudio);
    window.addEventListener("keydown", unlockAudio);

    // 课程策略（总时长 + 阶段划分）由后端下发；拿到后再启动课程
    fetch("/api/course/policy")
      .then((r) => (r.ok ? r.json() : null))
      .then((p) => { if (p) coursePolicy = p; })
      .catch(() => {})
      .then(() => { coursePolicyLoaded = true; if (!courseStarted) maybeShowStartGate(); });

    // 多老师：按「学科 + 所选老师」加载该老师的形象（同科多老师时由 TEACHER 区分）。
    // /api/teacher 会返回该老师专属的待机素材（静态睁眼帧 + 闭眼帧），
    // 顺带把底图/口型层/眨眼层统一换成该老师，确保画面里不会出现别的老师。
    fetch("/api/teacher?subject=" + encodeURIComponent(SUBJECT || "")
          + "&teacher=" + encodeURIComponent(TEACHER || ""))
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => {
        // 老师性别：浏览器回退朗读时据此挑男声/女声。
        // 必须放在 idle 判空**之前**，否则没有待机素材的老师拿不到性别。
        if (d && d.gender) { teacherGender = d.gender; refreshTtsVoice(); }
        const idle = d && d.idle;
        if (!idle) return;
        const idleV = $("idle-video"), still = $("idle-still"), blink = $("idle-blink");
        // 该老师的静态帧：同时作为底图 / 口型层 / 眨眼层的图源
        if (idle.still) {
          for (const id of ["avatar-img", "mouth-layer", "eye-layer-l", "eye-layer-r"]) {
            const el = $(id);
            if (el) el.src = idle.still;
          }
        }
        if (idle.still && still) {
          // 优先用静态帧：引擎对纯静音仍会有轻微嘴部/头部微动（像「还在说话」），静态帧则一动不动
          still.src = idle.still;
          still.classList.add("on");
          // 待机眨眼：叠一张「该老师真实闭眼帧」合成的整帧图
          if (blink && idle.blink) blink.src = idle.blink;
          if (idleV) idleV.style.display = "none";
        } else if (idle.video && idleV) {
          // 视频兜底：静音渲染视频自带呼吸/眨眼，无需叠加闭眼图
          if (blink) blink.removeAttribute("src");
          idleV.src = idle.video;
          idleV.load();
          idleV.play().catch(() => { /* 首次无手势可能被拦截，后续会再尝试 */ });
        }
      })
      .catch(() => { /* 后端未就绪时保持原形象，不影响使用 */ });

    // ---------- 启动 ----------
    // ---------- 空闲问候：长时间无交互时，让 AI 主动问候学生是否还在 ----------
    let lastActivityAt = Date.now();
    let idleNudges = 0;
    function markActivity() { lastActivityAt = Date.now(); idleNudges = 0; }
    // 学生任何输入/点击/触摸都算“有活动”：避免打字期间被误判空闲而反复念上一题
    ["pointerdown", "keydown", "input", "touchstart"].forEach((ev) =>
      window.addEventListener(ev, markActivity, { passive: true })
    );
    // 空闲问候策略：从后端读取“静默几秒后主动问候”（可在 .env 设 IDLE_NUDGE_SECONDS）
    let idlePolicy = { enable: true, seconds: 30, max: 3 };
    fetch("/api/idle/policy").then((r) => (r.ok ? r.json() : null)).then((p) => { if (p) idlePolicy = p; }).catch(() => {});
    setInterval(() => {
      if (!ws || ws.readyState !== 1 || !idlePolicy.enable) return;
      if (slidePlaying || document.getElementById("ask-card")) { lastActivityAt = Date.now(); return; }
      if (talking || aiSpeaking) { lastActivityAt = Date.now(); return; }  // 正在对话/讲解，不算空闲
      // 学生正在输入框打字（聚焦或已有内容）→ 不算空闲
      const inp = $("input");
      if (inp && (inp.value.trim() || document.activeElement === inp)) { lastActivityAt = Date.now(); return; }
      if (Date.now() - lastActivityAt >= idlePolicy.seconds * 1000 && idleNudges < idlePolicy.max) {
        idleNudges += 1; lastActivityAt = Date.now();
        send({ type: "idle" });
      }
    }, 1000);

    window.addEventListener("load", async () => {
      resize(); resizeAvatar(); setAvatarMood("idle");
      applyInsecureMode();     // HTTP 访问：禁用麦克风/摄像头并给出明确说明
      bindBoardControls(); updateSlideBar();   // 课件翻页 + 画笔交互
      initBoardTextGrip();                     // 讲解字幕条的上下拉动手柄
      connect();
      if (SECURE_CTX) {        // 非安全上下文下 getUserMedia 必然失败，不必白试一次
        try { await startCamera(); } catch (e) { console.warn("摄像头未就绪：", e); }
      }
    });
  </script>
